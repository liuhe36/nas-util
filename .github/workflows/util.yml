name: publish to docker hub

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # 手动点 Run workflow 重建一次,就能拿到最新的 yt-dlp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo "PROJECT_NAME=`expr $GITHUB_REPOSITORY ':' '[^/]*/\(.*\)'`" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      if: github.event_name != 'pull_request'
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Publish to Registry
      uses: docker/build-push-action@v7
      with:
        context: .
        file: util-Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        # 日期标签留作回滚用:新版 yt-dlp 出问题时可以退回某一天的镜像
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.BUILD_DATE }}
